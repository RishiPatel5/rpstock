name: ATH Drop Scanner

on:
  schedule:
    # Runs daily at 21:00 UTC (5 PM ET) — 1 hour after US market close
    - cron: "0 21 * * *"
  workflow_dispatch:   # lets you trigger it manually from GitHub Actions UI

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance requests schedule

      - name: Run scanner (single pass)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner/scanner.py --once

      - name: Save alerted state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scanner/alerted.json
          git diff --cached --quiet || git commit -m "chore: update alerted tickers state [skip ci]"
          git push
